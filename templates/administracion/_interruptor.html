<form method="post" action="{% url 'administracion:cambiar_activo' tipo objeto_id %}" class="d-inline">
  {% csrf_token %}
  <input type="hidden" name="siguiente" value="{{ siguiente }}">
  <button type="submit" class="interruptor{% if activo %} on{% endif %}" role="switch" aria-checked="{{ activo|yesno:'true,false' }}"
          aria-label="{{ activo|yesno:'Desactivar,Activar' }} {{ etiqueta }}" title="{{ activo|yesno:'Desactivar,Activar' }}"><span></span></button>
</form>
