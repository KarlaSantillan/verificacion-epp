{% comment %}Campana de notificaciones (HU15 / RF12-CA01). Se incluye en la barra superior de base.html.{% endcomment %}
<style>
  .campana { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; color: var(--epp-primary); border: 0; background: transparent; font-size: 1.25rem; }
  .campana:hover, .campana:focus-visible { background: var(--epp-soft); }
  .campana .contador { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--epp-bad); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px #fff; }
  .menu-notificaciones { width: 360px; max-width: calc(100vw - 32px); }
  .campana.sacudir i { display: inline-block; animation: sacudir-campana .8s ease-in-out 2; transform-origin: 50% 0; }
  @keyframes sacudir-campana { 0%,100% { transform: rotate(0); } 20% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(10deg); } 80% { transform: rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .campana.sacudir i { animation: none; } }
  .lista-campana { max-height: 320px; overflow-y: auto; }
</style>
<div class="dropdown" id="campana" data-url="{% url 'seguimiento:notificaciones' %}"
     data-ids="{{ ids_notificaciones }}">
  <button class="campana" id="campanaBoton" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Notificaciones, {{ total_notificaciones|default:0 }} pendientes">
    <i class="bi bi-bell"></i>{% if total_notificaciones %}<span class="contador">{{ total_notificaciones }}</span>{% endif %}
  </button>
  <div class="dropdown-menu dropdown-menu-end menu-notificaciones p-3 shadow" id="campanaMenu">
    {% include "seguimiento/_campana_contenido.html" %}
  </div>
</div>
